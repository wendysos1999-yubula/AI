<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 情报站 | 每日高密度观点卡片</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 装饰性浮动光球 -->
    <div class="floating-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Hero Banner -->
    <header class="hero-banner">
        <div class="banner-bg">
            <div class="grid-lines"></div>
            <div class="glow-orb glow-1"></div>
            <div class="glow-orb glow-2"></div>
            <div class="glow-orb glow-3"></div>
            <div class="particles">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="scan-line"></div>
        </div>
        <div class="banner-content">
            <div class="header-badge">AI INTELLIGENCE HUB</div>
            <h1 class="site-title">你的AI情报站</h1>
            <p class="site-tagline">每日 5-15 条高密度观点，快速理解 AI 领域最重要的变化</p>
            <div class="banner-stats">
                <div class="stat-item">
                    <span class="stat-number" data-target="365">365</span>
                    <span class="stat-label">天持续更新</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-number" data-target="2000">2000+</span>
                    <span class="stat-label">条情报收录</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-number" data-target="9">9</span>
                    <span class="stat-label">大信息源</span>
                </div>
            </div>
        </div>
    </header>

    <nav class="date-nav">
        <div class="container">
            <button id="prev-day" class="nav-btn">&larr; 前一天</button>
            <div class="date-picker-wrapper">
                <span id="current-date" class="current-date">2026-01-29</span>
                <input type="date" id="date-picker" class="date-picker-input" min="2026-01-01" />
            </div>
            <button id="next-day" class="nav-btn">后一天 &rarr;</button>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <section id="content-container" class="cards-grid">
                <!-- 内容将通过 JS 动态渲染 -->
            </section>

            <section id="empty-state" class="empty-state" style="display: none;">
                <p>该日期暂无情报数据</p>
            </section>
        </div>
    </main>

    <!-- 信息来源区域 -->
    <section class="sources-section">
        <div class="container">
            <h2 class="sources-title">信息来源</h2>
            <p class="sources-desc">所有情报均来自以下可信渠道，每日人工筛选与解读</p>
            <div class="sources-grid" id="sources-grid">
                <!-- JS 动态渲染 -->
            </div>
        </div>
    </section>

    <!-- AI 发展历史时间线 -->
    <section class="timeline-section">
        <div class="container">
            <h2 class="timeline-title">AI 发展历程</h2>
            <p class="timeline-desc">从学术探索到改变世界，见证人工智能的演进</p>

            <!-- 切换标签 -->
            <div class="timeline-tabs">
                <button class="timeline-tab active" data-period="explore">
                    <span class="tab-label">Part 1</span>
                    <span class="tab-title">探索期</span>
                    <span class="tab-years">1956-2022</span>
                </button>
                <button class="timeline-tab" data-period="boom">
                    <span class="tab-label">Part 2</span>
                    <span class="tab-title">爆发期</span>
                    <span class="tab-years">2023-至今</span>
                </button>
            </div>

            <!-- 统一的曲线图区域 -->
            <div class="timeline-container">
                <div class="timeline-wrapper" id="timeline-wrapper">
                    <!-- 曲线图 SVG -->
                    <div class="timeline-curve">
                        <svg viewBox="0 0 1120 250" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="curveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" style="stop-color:#667eea"/>
                                    <stop offset="100%" style="stop-color:#764ba2"/>
                                </linearGradient>
                                <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:rgba(102,126,234,0.2)"/>
                                    <stop offset="100%" style="stop-color:rgba(102,126,234,0)"/>
                                </linearGradient>
                            </defs>
                            <path class="curve-area" id="curve-area"></path>
                            <path class="curve-path" id="curve-path"></path>
                        </svg>
                    </div>
                    <!-- 时间轴主线 -->
                    <div class="timeline-axis"></div>
                    <!-- 年份标记 -->
                    <div class="timeline-years" id="timeline-years"></div>
                    <!-- 事件节点由 JS 渲染 -->
                </div>
            </div>

            <div class="timeline-legend">
                <div class="legend-item">
                    <span class="legend-dot major"></span>
                    <span>重大突破</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot normal"></span>
                    <span>重要进展</span>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <p>AI 情报站 - 信息优先级高于数量</p>
        </div>
    </footer>

    <!-- 文章生成模态框 -->
    <div id="article-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">公众号文章</h3>
                <button class="modal-close" id="close-article-modal">&times;</button>
            </div>
            <div class="modal-body" id="article-content"></div>
            <div class="modal-footer">
                <button class="btn-copy" id="copy-article">复制全文</button>
            </div>
        </div>
    </div>

    <!-- 图文卡片模态框 -->
    <div id="cards-modal" class="modal">
        <div class="modal-content modal-wide">
            <div class="modal-header">
                <h3 class="modal-title">小红书图文卡片</h3>
                <button class="modal-close" id="close-cards-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="xhs-cards-container" class="xhs-cards-grid"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-download" id="download-all-cards">下载全部图片</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
